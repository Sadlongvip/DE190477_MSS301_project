# Application Name
spring.application.name=payment-service

# Server Port (Chạy ở cổng 8084: customer: 8081, inventory: 8082, order: 8083, payment: 8084, api-gateway: 9000)
server.port=8084

# Toi uu hoa luong Tomcat
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=5

# MySQL Datasource Configuration (Database riêng: payment_db)
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Toi uu hoa HikariCP Connection Pool (tiet kiem RAM & ket noi MySQL)
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=payment_flyway_history

# Cấu hình VNPay Sandbox
vnpay.tmn-code=7IGY7DX2
vnpay.hash-secret=JMPHXLCVEWAGJPAGEVKAPJRXWZRMZCZV
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
# Trình duyệt sau khi thanh toán xong ở VNPay sẽ redirect về trang React Frontend này:
vnpay.return-url=http://localhost:5173/payment/vnpay-return

# Địa chỉ liên kết với order-service
services.order.url=http://localhost:8083

# Logging Configuration
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.dework.paymentservice=DEBUG

# Cấu hình Spring Kafka (Saga Choreography)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# =====================================================================
# Circuit Breaker (Resilience4j) - Chong loi lan truyen tu order-service
# =====================================================================
# Bọc mọi Feign client trong Circuit Breaker; đặt tên theo service đích (vd: order-service)
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true

# Siết timeout Feign để Circuit Breaker phản ứng nhanh (mặc định read là 60s -> treo thread rất lâu)
spring.cloud.openfeign.client.config.order-service.connect-timeout=2000
spring.cloud.openfeign.client.config.order-service.read-timeout=5000
# Retryer của Feign: 3 lần thử (2 retry) - callback PUT idempotent nên retry an toàn
spring.cloud.openfeign.client.config.order-service.retryer=com.dework.paymentservice.config.FeignRetryer

# Circuit Breaker: sau tối thiểu 5 lần gọi, nếu >= 50% lỗi (hoặc >= 80% gọi chậm > 3s) thì OPEN trong 15s, rồi HALF-OPEN thử lại 3 lần
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3

# TimeLimiter của Spring Cloud Circuit Breaker (dự trù đủ thời gian cho 2 lần retry, mặc định chỉ 1s)
resilience4j.timelimiter.configs.default.timeout-duration=12s
resilience4j.timelimiter.configs.default.cancel-running-future=true

# Theo dõi trạng thái Circuit Breaker qua Actuator
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
