# Application Name
spring.application.name=report-service

# Server Port (customer: 8081, inventory: 8082, order: 8083, payment: 8084, report: 8085, api-gateway: 9000)
server.port=8085

# Toi uu hoa luong Tomcat
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=5

# MySQL Datasource Configuration (Đọc dữ liệu thống kê từ order_db với ddl-auto=none)
spring.datasource.url=jdbc:mysql://localhost:3306/order_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Toi uu hoa HikariCP Connection Pool (tiet kiem RAM & ket noi MySQL)
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate Configuration (ddl-auto=none để chỉ đọc dữ liệu thống kê từ các bảng sẵn có)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình địa chỉ các microservice liên kết qua OpenFeign
services.order.url=http://localhost:8083
services.inventory.url=http://localhost:8082
services.customer.url=http://localhost:8081

# Logging Configuration
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.dework.reportservice=DEBUG

# =====================================================================
# Circuit Breaker (Resilience4j) - Chong loi lan truyen tu order-service
# =====================================================================
# Bọc mọi Feign client trong Circuit Breaker; đặt tên theo service đích (vd: order-service)
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true

# Siết timeout Feign để Circuit Breaker phản ứng nhanh (trang 100 đơn có thể nặng nên read rộng hơn các service khác)
spring.cloud.openfeign.client.config.order-service.connect-timeout=2000
spring.cloud.openfeign.client.config.order-service.read-timeout=10000
# Retryer của Feign: 2 lần thử (1 retry) cho lỗi tạm thời
spring.cloud.openfeign.client.config.order-service.retryer=com.dework.reportservice.config.FeignRetryer

# Circuit Breaker: sau tối thiểu 5 lần gọi, nếu >= 50% lỗi (hoặc >= 80% gọi chậm > 3s) thì OPEN trong 15s, rồi HALF-OPEN thử lại 3 lần
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3

# TimeLimiter của Spring Cloud Circuit Breaker (mặc định chỉ 1s -> tăng vì đồng bộ trang đơn hàng có thể chậm)
resilience4j.timelimiter.configs.default.timeout-duration=15s
resilience4j.timelimiter.configs.default.cancel-running-future=true

# Theo dõi trạng thái Circuit Breaker qua Actuator
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
