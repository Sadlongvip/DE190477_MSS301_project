# Application Name
spring.application.name=report-service

# Server Port (customer: 8081, inventory: 8082, order: 8083, payment: 8084, report: 8085, api-gateway: 9000)
server.port=8085

# Toi uu hoa luong Tomcat
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=5

# MySQL Datasource Configuration (Cơ sở dữ liệu độc lập report_db tuân thủ Database-per-service)
spring.datasource.url=jdbc:mysql://localhost:3306/report_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Toi uu hoa HikariCP Connection Pool (tiet kiem RAM & ket noi MySQL)
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# JPA / Hibernate Configuration (ddl-auto=none để tạo bảng thông qua Flyway V1, không thông qua application)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migration Configuration (Tự động migrate schema qua file db/migration/V1)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=report_flyway_history

# Apache Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=report-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Cấu hình địa chỉ các microservice liên kết qua OpenFeign
services.order.url=http://localhost:8083
services.inventory.url=http://localhost:8082
services.customer.url=http://localhost:8081

# Logging Configuration
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.dework.reportservice=DEBUG
