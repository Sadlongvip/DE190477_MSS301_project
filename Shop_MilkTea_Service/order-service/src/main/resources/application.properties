# Application Name
spring.application.name=order-service

# Server Port (Chạy ở cổng 8083 theo cấu hình hệ thống: customer: 8081, inventory: 8082, order: 8083, api-gateway: 9000)
server.port=8083

# Toi uu hoa luong Tomcat
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=5

# MySQL Datasource Configuration (Database riêng: order_db)
spring.datasource.url=jdbc:mysql://localhost:3306/order_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Toi uu hoa HikariCP Connection Pool (tiet kiem RAM & ket noi MySQL)
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=order_flyway_history

# Logging Configuration - Tinh gọn log console tránh tràn bộ đệm RAM
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.web=INFO

# Cấu hình kết nối tới inventory-service
services.inventory.url=http://localhost:8082

# Cấu hình Spring Kafka (Saga Choreography)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Cấu hình giả lập kịch bản số 8 (KB8: Compensation lỗi -> Treo ở COMPENSATING giống Slot 13)
# Mặc định là false (bình thường), đổi thành true khi cần demo KB8 hoặc test tự động retry 3 lần
saga.demo.simulate-compensation-failure=false

# =====================================================================
# Circuit Breaker (Resilience4j) - Chong loi lan truyen tu inventory-service
# =====================================================================
# Bọc mọi Feign client trong Circuit Breaker; đặt tên theo service đích (vd: inventory-service)
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true

# Siết timeout Feign để Circuit Breaker phản ứng nhanh (mặc định read là 60s -> treo thread rất lâu)
spring.cloud.openfeign.client.config.inventory-service.connect-timeout=2000
spring.cloud.openfeign.client.config.inventory-service.read-timeout=5000
# Retryer của Feign: 2 lần thử (1 retry) cho lỗi tạm thời
spring.cloud.openfeign.client.config.inventory-service.retryer=com.dework.orderservice.config.FeignRetryer

# Circuit Breaker: sau tối thiểu 5 lần gọi, nếu >= 50% lỗi (hoặc >= 80% gọi chậm > 3s) thì OPEN trong 15s, rồi HALF-OPEN thử lại 3 lần
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3

# TimeLimiter của Spring Cloud Circuit Breaker (mặc định chỉ 1s -> phải tăng tương ứng read-timeout Feign)
resilience4j.timelimiter.configs.default.timeout-duration=6s
resilience4j.timelimiter.configs.default.cancel-running-future=true

# Theo dõi trạng thái Circuit Breaker qua Actuator
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents

